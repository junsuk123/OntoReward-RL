# Guide 11.4-11.6 at miniature size: protocol confirmation-mini/1
# (current_semantics/confirmation.py).  The user asked on 2026-11-19 for a miniature
# validation because the full confirmation (confirmation_v1.yaml: 20 seeds x 600 updates,
# 2,400 Isaac flights, about 2-2.5 days) was too long; that protocol was stopped before any
# model was evaluated and is archived in <root>/confirmation_full_superseded/.
#
# Same procedure and decision rule as confirmation/1.  Smaller in four places only:
#   * 6 fresh training seeds instead of 20 (x 4 arms = 24 models);
#   * 300 PPO updates per model instead of 600, for EVERY arm.  Episodes per update (12),
#     PPO settings, curriculum and the checkpoint rule are unchanged.  300 is the shortest
#     budget at which every development model under WMON navigation had already reached
#     difficulty 1.0 (first at update 138-366, all but one by 260); below it the slower
#     arms would select no checkpoint and score zero by construction;
#   * 12 checkpoint-selection seeds instead of 24, 30 environments per evaluation cell
#     instead of 100;
#   * 9 Isaac cases per model (3 per condition) instead of 30: 216 flights.
# What it measures is therefore "the development's advantage under a halved PPO budget,
# on 6 fresh seeds".  With n = 6 the paired-t intervals are wide (t at 97.5 % two-sided,
# 5 df: 3.16); a comparison that fails reads "not confirmed", never "equivalent".
protocol: confirmation-mini/1
development_protocol: development/1
training_seeds: [20, 21, 22, 23, 24, 25]
# Training episode seed = base + seed * 1e6 + update * 12 + episode: 120,000,000-125,003,599.
# (Seeds 20-23 under this base ran 4-28 updates of the stopped confirmation/1 run; nothing of
# it was evaluated, so reusing them leaks no result.)
train_seed_base: 100000000
validation_seeds: [993101, 993102, 993103, 993104, 993105, 993106,
                   993107, 993108, 993109, 993110, 993111, 993112]
workers: 6
env_seed_base: 200000000
updates: 300
episodes_per_cell: 30
analysis:
  primary_comparisons: [semantic_mlp_ppo, untyped_gnn_ppo]
  primary_family_alpha: 0.05
  practical_comparison: raw_ppo
  practical_alpha: 0.05
  guard_alpha: 0.05
  id_success_ci_low_min: -0.02
  four_ood_success_ci_low_min: -0.02
  ood_unsafe_ci_high_max: 0.01
  risk_family_alpha: 0.05
isaac:
  protocol: isaac-confirmation-mini/1
  mode: deterministic
  conditions:
    composition_id: [994201, 994202, 994203]
    composition_ood: [994211, 994212, 994213]
    combined_id: [994221, 994222, 994223]
