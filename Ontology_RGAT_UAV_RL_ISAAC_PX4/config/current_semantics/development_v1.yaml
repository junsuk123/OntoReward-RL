# spatial_current_semantics_v1 development stage (guide 11.1-11.5), registered by
# `./run.sh current-semantics-3d --stage register-development` and run by `--stage develop`.
# Every key is required; the registration binds this file's hash to the main
# contract (algorithm, task, features, graph, calibration, G4) and `develop` refuses
# any change. Budget, curriculum, PPO and training randomisation are the G4-passed
# pilot's (g4_pilot in the main config), identical for every arm.
protocol: development/1
# "Typed" in guide 11.3: the proposed arm; the two primary comparisons are against
# semantic_mlp_ppo ("MLP") and untyped_gnn_ppo ("Untyped"), the practical one
# against raw_ppo ("Raw").
proposed_arm: ontology_rgat_ppo
arms: [raw_ppo, semantic_mlp_ppo, untyped_gnn_ppo, ontology_rgat_ppo]
# Model initialisation seeds; 0 and 1 trained every G4 pilot, so they are not reused.
training_seeds: [10, 11, 12, 13, 14]
# Training episode seed = base + training_seed * 1e6 + update * episodes + episode
# (30,000,000-34,007,199: outside every audited, diagnostic and pilot range).
train_seed_base: 20000000
# Checkpoint selection at difficulty 1.0 (in-distribution split, both policy modes).
validation_seeds: [992101, 992102, 992103, 992104, 992105, 992106, 992107, 992108,
                   992109, 992110, 992111, 992112, 992113, 992114, 992115, 992116,
                   992117, 992118, 992119, 992120, 992121, 992122, 992123, 992124]
workers: 16
evaluation:
  # Guide 11.2: ten cells x 100 environments per training seed; each training seed
  # has its own environments, shared by its four arms. Seed = base + index of the
  # training seed * 100000 + cell index * 1000 + k. Deterministic policy.
  episodes_per_cell: 100
  env_seed_base: 50000000
  # OOD intensities fixed BEFORE any representation arm trained, on the common Raw
  # baseline only (G4 pilot-7 checkpoints, deterministic, d=1, seeds 995001-995048,
  # results/.../development_design/ood_calibration.txt), by the rule declared before
  # the measurement: the MILDEST level whose Raw success lies in [20 %, 80 %].
  #   motion a2 0.4-0.6 0.92, 0.6-0.9 0.71 <-, 0.9-1.2 0.53
  #   dropout 3-4 s 0.67 <-, 3-5 s 0.59, 4-6 s 0.45 (trained 1-3 s: 0.89)
  #   noise x5 0.73 <-, x10 0.02, x20 0.00
  # Composition is not tuned (its held-out combinations are the task's): Raw 0.91
  # there against 0.94 nominal.
  # Exogenous dropouts start U(start) s after handover (the training blackout's window).
  dropout_start_s: [0.5, 4.0]
  cells:
    composition_id: {split: in_distribution}
    composition_ood: {split: composition}
    motion_id: {split: in_distribution}
    motion_ood: {split: in_distribution, pad_acceleration_m_s2: [0.6, 0.9]}
    dropout_id: {split: in_distribution, dropout_s: [1.0, 3.0]}
    dropout_ood: {split: in_distribution, dropout_s: [3.0, 4.0]}
    noise_id: {split: in_distribution}
    noise_ood: {split: in_distribution, optical_noise_scale: 5.0}
    combined_id: {split: in_distribution, dropout_s: [1.0, 3.0]}
    combined_ood: {split: in_distribution, pad_acceleration_m_s2: [0.6, 0.9],
                   dropout_s: [3.0, 4.0], optical_noise_scale: 5.0}
# Guide 11.5 development gate. Success = SUCCESS within the 70 s mission; unsafe =
# the Evaluator's unsafe statuses (unsafe / missed-pad / unauthorized contact,
# envelope). "ID" is the mean of the five ID cells, the "four OOD" mean is motion,
# dropout, noise and combined; the unsafe guard averages all five OOD cells.
gates:
  validation_deterministic_success_min: 0.5
  validation_sampled_success_min: 0.25
  composition_margin_min: 0.0
  id_drop_max: 0.02
  ood_mean_drop_max: 0.02
  ood_unsafe_increase_max: 0.01
