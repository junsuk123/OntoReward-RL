# replication-mini/1 (current_semantics/confirmation.py): the confirmation-mini/1 experiment
# repeated with an EXISTING self-navigation estimator, the constant-acceleration Kalman filter
# (CA-KF; config spatial_view_contact_v1_nav4_kalman.yaml), so the landing-policy result no
# longer depends on the kinematic WLS estimator the author developed in separate research.
# User request 2026-11-19 ("remove the WMON navigation everywhere if possible; analyse first,
# then run a miniature experiment that takes less than a day").
#
# Why, measured before registering (one navigation-neutral policy, same seeds, same sensor
# degradation, only the estimator differs; 80 local episodes each): the two estimators give
# the same closed-loop outcome (CA-KF 72/80, kinematic WLS 71/80; paired 7 vs 6) and
# observation errors of the same size, so the kinematic-WLS-only advantage is not explained
# by a harsher navigation condition.  The one signal that recurs across estimators is
# training reliability: no R-GAT model ever failed the curriculum, while comparison arms did
# under CA-KF (semantic MLP 2/5) and under the kinematic WLS miniature run.
#
# Identical to confirmation-mini/1 as amended (three arms, decision rule) in every seed,
# budget, cell and Isaac case, so each case pairs across the two estimators.  The CA-KF
# root's development gate FAILED, so this is a replication (complete development procedure
# required, not a passed gate), not a confirmation of that root.
protocol: replication-mini/1
development_protocol: development/1
arms: [raw_ppo, untyped_gnn_ppo, ontology_rgat_ppo]
training_seeds: [20, 21, 22, 23, 24, 25]
train_seed_base: 100000000
validation_seeds: [993101, 993102, 993103, 993104, 993105, 993106,
                   993107, 993108, 993109, 993110, 993111, 993112]
workers: 6
env_seed_base: 200000000
updates: 300
episodes_per_cell: 30
analysis:
  # Primary: ten-cell mean success, R-GAT minus Untyped GNN and minus PPO, each two-sided
  # paired-t at 97.5 % (Bonferroni over the pair), lower bound above zero.  Guards against
  # PPO as in guide 11.5.  Registered secondary (reported, not decisive): training
  # reliability = models whose curriculum reached difficulty 1.0 within the budget, per arm,
  # Fisher exact against R-GAT; the Isaac success comparison; risk, Holm-adjusted.
  primary_comparisons: [untyped_gnn_ppo, raw_ppo]
  primary_family_alpha: 0.05
  practical_comparison: null
  practical_alpha: 0.05
  guard_alpha: 0.05
  id_success_ci_low_min: -0.02
  four_ood_success_ci_low_min: -0.02
  ood_unsafe_ci_high_max: 0.01
  risk_family_alpha: 0.05
isaac:
  protocol: isaac-replication-mini/1
  mode: deterministic
  conditions:
    composition_id: [994201, 994202, 994203]
    composition_ood: [994211, 994212, 994213]
    combined_id: [994221, 994222, 994223]
