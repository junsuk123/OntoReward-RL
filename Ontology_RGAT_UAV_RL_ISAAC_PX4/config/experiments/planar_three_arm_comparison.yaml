extends: two_pipeline_comparison.yaml
experiment: planar_ontology_graph_state
paired_seeds: true

# The CICS2026 headline comparison, rebuilt 2026-09-23.
#
# WHAT CHANGED, AND WHY
#
# The previous design put the ontology in the REWARD: a frozen R-GAT predicted
# near-future FOV unavailability and its scalar was subtracted as
# ``-lambda_fov q(G_t)``. Two problems with it, both measured rather than
# suspected:
#
#   1. The ontology's contribution could not be separated from the reward
#      weight it was multiplied by. A term worth 0.1 against a five-term
#      shaping sum is a small perturbation of a reward that already works, and
#      a run either shows a difference too small to attribute or a difference
#      that a hand-tuned constant would have produced too.
#   2. The policy never saw the ontology. Whatever structure the graph carried
#      reached the actor only through a scalar penalty, averaged over the whole
#      situation, one step at a time.
#
# The graph is now the policy's STATE. The reward is identical on both learned
# arms -- the same five shaping terms, the same active-perception term, the
# same terminal values -- and the single experimental factor is whether the
# actor and the critic see the ontology situation graph. That is a factor the
# comparison can actually attribute, and it is what the reduced 2-D study
# (github.com/junsuk123/ugv_landing_2d_workspace) established the method on.
#
# The reduced control envelope is the second change and applies to all three
# arms equally: see config/shin2026-planar-system.yaml and
# docs/PLANAR_ENVELOPE.md.

# Only the LEARNED arms belong here. ``pipelines`` drives training, the PPO
# checkpoint machinery and _training_pair_replicas, whose
# ``pair_count % len(methods) == 0`` invariant is satisfied by two arms on four
# pairs and would be broken by three. The control condition trains nothing and
# holds no pair during training; it enters only at evaluation.
pipelines: [shin_se_fixed, shin_se_onto_rgat_state]

# The two declarations are deliberately identical everywhere except the last
# two lines. In particular ``reward_mode`` is the same and no ontology term
# appears on the reward side of either.
pipeline_contract:
  shin_se_fixed:
    state_estimation: true
    auxiliary_estimation_loss: true
    active_perception: true
    reward_mode: shin_table_active
    ontology_enabled: false
    ontology_input_mode: null
    use_direct_rgat_potential: false
    fov_risk_reward: false
    use_adaptive_reward_weights: false
    adaptive_reward_architecture: null
    fov_reward_readout: null
    graph_state: false
    graph_state_representation: null
  shin_se_onto_rgat_state:
    state_estimation: true
    auxiliary_estimation_loss: true
    active_perception: true
    reward_mode: shin_table_active
    ontology_enabled: true
    ontology_input_mode: state_situation_graph
    use_direct_rgat_potential: false
    fov_risk_reward: false
    use_adaptive_reward_weights: false
    adaptive_reward_architecture: null
    fov_reward_readout: null
    graph_state: true
    graph_state_representation: ontology_rgat

# The ontology situation-graph encoder. It is part of the policy: PPO trains
# it, there is no offline stage, no artifact and no checksum gate, and
# ``validate_pipeline_configuration`` refuses a configuration that tries to
# freeze it or point it at a pre-trained file.
graph_state:
  # Nine nodes, four relations, twelve declared edges plus self-loops. The
  # schema itself is in python/ontology_rgat/rgat/state_graph.py and is not
  # configurable from here: a schema change invalidates every checkpoint, so it
  # belongs in code where a test can fix it.
  representation: ontology_rgat
  # Width. The reduced study measured 16 against 32 over three seeds and took
  # 32: 16 landed 44% of scenarios against 56%, and the mean score was -109
  # against -21. 32 costs about twice the training time. Lower it to 16 if the
  # budget is short, and report that you did.
  hidden_dim: 32
  graph_dim: 32
  relation_dim: 6
  heads: 1
  # Actor and critic encoders are seeded from this and this + 1.
  seed: 42
  freeze_during_ppo: false

# Reward weights, SHARED BY BOTH LEARNED ARMS. The comparison's single factor
# is the situation graph, so this block is read once and handed to both. It
# deep-merges onto the Table-III block in shin2026_baseline.yaml; anything not
# named here keeps its paper value.
#
# Table III's weights are written for the paper's four-dimensional action and
# its own reward scale. Transcribed literally onto the reduced planar envelope
# they priced the task's own actuator out of existence. Measured 2026-10-02
# over 40 episodes per arm, the per-episode decomposition was:
#
#     attitude -69.6 | vertical speed -48.2 | undershoot -40.5
#     active perception -6.0 | task -4.3 | lateral progress  -3.4
#
# The approach signal was the smallest term in the sum, and negative. Scored
# over a whole episode, loitering out of reach until the horizon expired beat
# approaching and landing safely by 99.8. Both arms learned exactly that: in
# its last 80 policy episodes the proposed arm touched the deck once, timed out
# or flattened the battery 79 times, and held the pad in view the whole while
# (FOV loss 0.078, visible keypoints 0.911) from 5.7 m out.
reward:
  shaping:
    # Closing the gap is the task, so it is the dominant shaping term.
    lateral_progress: 5.0
    # Table III's -2|omega_z| prices YAW RATE, a channel the paper's task never
    # needs -- pricing it costs the task nothing. The planar substitution kept
    # the weight but not the role: tilt is this envelope's only source of
    # longitudinal acceleration, so -2|tilt| taxes the approach itself. The
    # term stays (gratuitous attitude use is still discouraged) at a weight
    # that cannot outbid the manoeuvre it pays for.
    attitude: 0.1
  terminal:
    # The terminal is the task. At +-10 against ~250 steps of shaping summing
    # to about -150, a safe landing was inside the noise of the shaping it cost.
    success: 50.0
    # A horizon timeout used to be the only free terminal -- contact, crash,
    # drift and a flat battery all scored, a timeout scored zero -- which made
    # running the clock out the cheapest way to end an episode.
    timeout: -5.0

# Explicitly off. The retired reward-side method is still runnable under its
# own arm id, but mixing the two in one run would give the comparison two
# factors, and ``validate_pipeline_configuration`` rejects that.
fov_risk: null
fov_risk_design: null
rgat_design: null

# Display names. The dashboard, the RViz HUD and the figures all read this one
# list rather than hard-coding a name apiece.
arm_labels:
  shin_se_fixed: "Baseline · PPO (관측 벡터)"
  shin_se_onto_rgat_state: "Proposed · PPO + 온톨로지 상황 그래프"

# The non-learned control condition: proportional-navigation guidance in the
# sagittal plane, reading only the frozen encoder's output. It is the reference
# law of the reduced 2-D study, so the three arms here are the three arms
# there, and it emits the same three-channel planar action the policies do --
# a difference between it and an arm is a difference in control, not in
# observation or in authority.
baseline_arms:
  - method: pn_guidance_v1
    label: "PN guidance (비학습)"
    controller: pn_guidance_v1
    learned: false

control:
  dt_seconds: 0.1
  horizon_steps: 300
  # The reduced envelope. Three channels, shared by every arm:
  #   a_fwd   fore/aft acceleration      [m/s^2]
  #   a_z     climb/descent acceleration [m/s^2]
  #   tilt    longitudinal tilt          [deg]
  # Lateral velocity and yaw rate are structurally zero and are not channels.
  action: planar_longitudinal
  # (longitudinal, vertical). Sized against the decks below, whose fastest
  # segment is 1.00 m/s: 1.6 m/s leaves 0.6 m/s of closing speed at the worst
  # case, which is the margin the retired 6-deck design needed and did not
  # always have.
  max_velocity_m_s: [1.6, 0.9]
  max_acceleration_m_s2: [1.2, 0.8]
  # Attitude channel. 12 deg is what the privileged teacher was already
  # limited to, so the policy's attitude authority matches the demonstrations'.
  max_longitudinal_tilt_deg: 12.0
  max_tilt_rate_deg_s: 60.0
  # Set false to run the two-channel ablation: the policy keeps [a_fwd, a_z]
  # and the tilt channel is held at zero for every arm. The action dimension
  # does not change, so checkpoints stay loadable.
  tilt_channel_enabled: true
  # The approach cone. The vertical channel may not command a descent while
  # the pad sits outside a cone about nadir, measured as a bearing tangent --
  # horizontal offset over altitude -- unless the vehicle is already inside the
  # flare range, where the pad legitimately fills the camera and leaves it.
  #
  # An ENVELOPE constraint, alongside the velocity, acceleration and tilt
  # limits and the structurally zero lateral velocity, and therefore identical
  # for every arm: the two learned ones and the non-learned control condition.
  # It changes the action space, not the reward, and no checkpoint's action
  # dimension moves, so stored policies stay loadable.
  #
  # Measured 2026-09-25 over 1302 training episodes of the two learned arms:
  # losing the pad is a one-way door. Reacquisition events were ZERO in every
  # episode, climb-while-blind was zero, descend-while-blind was one, and of
  # the 609 episodes whose mean visible-keypoint fraction fell below 0.3 not a
  # single one landed -- against 4.5 % and 6.1 % for the episodes that kept it.
  # The estimator follows rather than leads: its position RMSE is 0.6-0.7 m
  # while the pad is in view and 2.9-5.6 m once it is not.
  #
  # 0.80 is the same tolerance the PN control law carries internally, and half
  # the 1.58 of bearing tangent this camera holds ahead of nadir. Set to 0 to
  # fly the retired unconstrained envelope.
  # Relaxed 0.80 -> 1.60 on 2026-10-02, identically for every arm.
  #
  # 0.80 was half the bearing this camera holds, chosen as a margin. Measured
  # on the rebalanced-reward run, it was instead a trap for the graph-state
  # arm: it ended episodes 6.66 m out at about 4.5 m altitude, a bearing
  # tangent near 1.48, so the cone forbade every descent while the arm could
  # not close the gap -- 89 consecutive episodes with zero deck contact, mean
  # episode length at the 266-step horizon. The baseline closed to 1.5-2.4 m
  # (tangent ~0.4) and passed the gate, which is why only one arm stalled.
  #
  # 1.60 is the camera's own limit (1.58 of bearing tangent ahead of nadir),
  # so the rule becomes "you may descend towards a pad you can actually see".
  # The two protections that matter are untouched: ``descent_permitted``
  # still refuses a descent when the keypoint observation is not trustworthy,
  # and still refuses one when the pad has left the frame entirely.
  approach_cone_tolerance: 1.60
  approach_cone_flare_range_m: 1.20
  # raw_scale * range, measured in flight; see the PN guidance module.
  approach_cone_reference_scale: 0.65
  curriculum_min_action_scale: 0.90
  curriculum_min_pad_motion_scale: 0.35
  require_initial_pad_visible: true

# Deck motion for PPO. All three scenarios, rotated by episode index, so the
# policy trains on the same speed range it is evaluated on.
training:
  scenarios:
    - segmented_cruise_slow
    - segmented_cruise_medium
    - segmented_cruise_fast

behavior_cloning:
  enabled: true
  source_pipeline: no_se_fixed
  # A recovered flight is longer than an approach, and the segmented decks put
  # a speed change at 3 s and another at 15 s, so the demonstration horizon has
  # to outlast both. Inherited from the six-deck design, which measured it.
  horizon_steps: 600
  # PN guidance is the teacher as well as the control condition. That is the
  # reduced study's arrangement and it is what makes the warm start a property
  # of the comparison rather than of one side of it: both learned arms clone
  # the same demonstrations, from the law the control arm flies.
  #
  # Each arm clones into its own model. They cannot share one checkpoint --
  # the proposed arm has encoder parameters the baseline does not -- so the
  # shared thing is the demonstration set, the epoch count and the seed.
  #
  # RISK, STATED RATHER THAN DISCOVERED IN FLIGHT. PN guidance has not yet been
  # flown on this stack, and the last purely image-based teacher tried here --
  # image_based_visual_servo_v1 -- landed 0 of 26 attempts: it lost the deck
  # outright and never re-acquired it, which pointed at the encoder's
  # raw_scale collapsing out of frame rather than at the loop. PN reads the
  # same signal for its range, so the same failure is available to it.
  #
  # Two things make this an acceptable risk rather than a gamble. The reduced
  # envelope removes the lateral axis that servo was hunting on, and the
  # fallback is one line: set this to
  # ``privileged_relative_state_velocity_pd_v4``, whose measured landing rate
  # on this stack is roughly 1 in 3 and whose gains are inherited below. The
  # demonstrations are training-only under either teacher, and nothing from
  # them reaches the deployed actor beyond the image embedding, the
  # proprioception and the situation graph.
  #
  # PN exhausted all 60 flights on 2026-09-25 with only one accepted landing:
  # 35 flights depleted the battery and 13 made unsafe contact. Use the
  # documented fallback rather than widening the budget. The non-learned
  # evaluation arm remains PN guidance; only the training-only label source
  # changes, and the teacher id is part of the demonstration fingerprint.
  teacher: privileged_relative_state_velocity_pd_v4
  # Exploration handed to PPO after the clone. The 2026-10-01 run shipped -2.5
  # (sigma 0.082) and PPO never moved it: the KL back-off held the effective
  # learning rate near its 5e-6 floor, so entropy was 3*(log_std + 1.4189) =
  # -3.24 at policy episode 1 and -3.26 at episode 750, and both arms spent
  # 750 episodes replaying the clone. -1.8 (sigma 0.165) is the module default
  # and is applied identically to both learned arms.
  post_log_std: -1.8
  scenarios:
    - segmented_cruise_slow
    - segmented_cruise_medium
    - segmented_cruise_fast
  successful_episodes: 4
  max_attempts: 60
  parallel_pairs: 0
  # The demonstration pass may fly an easier regime than PPO: it only has to
  # produce successful landings for the policy to start from.
  curriculum: 0.20
  # PN gains. Transcribed from the reduced study and re-based on this camera;
  # see python/ontology_rgat/controllers/pn_guidance.py for what each does.
  pn_navigation_gain: 3.0
  pn_approach_speed_m_s: 0.45
  pn_approach_gain: 0.60
  pn_closing_gain: 1.20
  pn_vertical_gain: 2.00
  pn_climb_reference_m_s: 0.35
  pn_noise_std: 0.01
  # Apparent RMS keypoint scale at one metre of RANGE: the only inverse-range
  # signal available without estimating relative state. Measured on this stack
  # 2026-09-23 from 256 frames with the pad fully visible between 4.3 m and
  # 14 m -- raw_scale * range = 0.65 +- 0.07, against four times that scatter
  # when read as an altitude. The first PN stage shipped 0.06, an altitude
  # constant off by eleven times, and flew the whole approach believing it was
  # 0.43 m from a pad 4.7 m away.
  #
  # These keys are PN's own. The retired image servo reads unprefixed
  # ``reference_scale``/``flare_scale``/``descent_floor`` and means different
  # things by them, exactly as the PD owns the ``pd_`` ones.
  pn_reference_scale: 0.65
  # Commit to the flare at this estimated range, in metres. Not on
  # apparent_target_scale: it is reliability-weighted and clipped at one, so it
  # saturates around 0.9 m and reached its shipped 0.20 threshold at 4.9 m.
  pn_flare_range_m: 1.20
  # The approach cone: the horizontal offset may be at most this many times
  # the altitude while descending. Outside it the law holds altitude and closes
  # the gap first. Without it, 37 of 60 teacher flights on 2026-09-24 descended
  # with a metre still to close, lost the pad past the frame edge at about one
  # metre of altitude, climbed, re-acquired and repeated until the battery was
  # flat. See the controller module docstring for the measurement and margin.
  pn_alignment_tolerance: 0.80
  pn_flare_descent_m_s: 0.25
  pn_descent_floor_m_s: 0.10

# Three scenarios, evenly. The retired decks are not deleted -- the six-deck
# design still declares them -- but a run that does not fly them must say zero
# explicitly, because ``evaluation`` is a mapping the loader deep-merges.
evaluation:
  segmented_cruise_slow: 400
  segmented_cruise_medium: 400
  segmented_cruise_fast: 400
  straight_escape_burst: 0
  straight_escape_burst_track: 0
  straight_8mps: 0
  linear_acceleration_wave: 0
  circle: 0
  zigzag: 0
  u_turn: 0
  vertical_heave_boat: 0
