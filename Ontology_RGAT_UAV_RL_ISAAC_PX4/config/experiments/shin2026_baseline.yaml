experiment: shin2026
reward_mode: shin2026
system_config: ../shin2026-system.yaml
paper:
  doi: 10.1109/LRA.2026.3674011
  reproduction_claim: methodological-interface
camera: {resolution: [512, 320], grayscale: true, horizontal_fov_deg: 90, pitch_down_deg: 60}
estimator:
  image_embedding: 512
  lstm_hidden: 512
  latent_dimension: 256
  output_dimension: 6
  # [dx, dy, dz, dvx, dvy, dvz] normalization. Network output and RMSE remain
  # in physical units; only estimator optimization/reward loss is normalized.
  relative_state_scale: [3.0, 3.0, 8.0, 3.0, 3.0, 2.0]
  # PACMAN weights are not public. Pretrain the executable six-keypoint and
  # local-descriptor path on projections of this run's actual six-keypoint
  # fiducial landing target, then freeze it before recurrent PPO as in the
  # paper's architecture. This is a documented compatible approximation, not a
  # reproduction of PACMAN.
  keypoint_pretraining:
    enabled: true
    samples_quick: 64
    samples_full: 512
    epochs_quick: 2
    epochs_full: 6
    batch_size: 16
    learning_rate: 0.001
    seed: 41026
    # Before PPO, label unannotated Isaac frames by projecting the six known
    # pad landmarks through the simulator's training-only pose for that frame,
    # reserve a held-out split, and retain fine-tuning only when it improves
    # real-render coordinate RMSE. No detector is involved, so an unreadable
    # frame still receives correct supervision instead of being discarded.
    #
    # The frames are *surveyed*: the vehicle is flown to each pad-relative
    # viewpoint below and a couple of frames are taken there. The earlier
    # procedure polled the camera where the stack left the vehicle after boot,
    # so all 48 frames were one hover; a randomly held-out quarter of them
    # scored 10 px / 100 % on an encoder that then reported no landmark on
    # 99.7 % of the in-frame steps of the run it had certified.
    empirical_samples_quick: 12
    empirical_samples_full: 48
    minimum_empirical_samples: 8
    empirical_validation_fraction: 0.25
    # Viewpoints: camera-centred hover offsets, displaced across the image
    # plane by these fractions of their own altitude and turned by these yaws.
    # The outer lateral ring puts the pad at the frame edge, which is where
    # most of a real approach is spent.
    survey_altitudes_m: [1.6, 2.6, 4.0, 6.0]
    survey_lateral_fractions:
      - [0.0, 0.0]
      - [0.30, 0.14]
      - [-0.30, 0.14]
      - [-0.30, -0.14]
      - [0.30, -0.14]
      - [0.70, 0.0]
      - [-0.70, 0.0]
      - [0.0, 0.34]
      - [0.0, -0.34]
    survey_yaws_deg: [0.0, 35.0, -35.0]
    # Two frames per pose, four camera frames apart: consecutive 30 Hz frames
    # of one hover differ by less than a grey level.
    survey_frames_per_viewpoint: 2
    survey_frame_stride: 4
    survey_travel_timeout_s: 45.0
    survey_tolerance_m: 0.8
    survey_speed_tolerance_m_s: 0.7
    survey_settle_s: 0.7
    # A calibration set that does not actually spread out certifies nothing,
    # so it is refused here instead of after four hundred blind episodes.
    minimum_calibration_viewpoints: 6
    minimum_calibration_altitude_span_m: 1.5
    minimum_calibration_lateral_span_m: 1.0
    # An encoder that cannot report the labelled landmarks from viewpoints it
    # never trained on would fly blind: the semantic observation counts an
    # unreported landmark as no landmark.
    minimum_holdout_visibility_recall: 0.50
    # Calibrated on a held-out live-Isaac split: the previous 2 x 1e-4 pass
    # made no measurable change; 20 x 1e-3 reduced 23.2 px to <=16.8 px in
    # the stage-5 audit while the best validation checkpoint was retained.
    #
    # 20 was then raised to 60 because it left the recall gate above a
    # coin flip. Replaying a real 24-viewpoint survey off the datastore (the
    # frozen split, the same seed), held-out recall oscillates epoch to epoch
    # and only 9 of 20 epochs sit above the 0.50 minimum, so which epoch the
    # best-checkpoint rule happens to select decides whether the run starts at
    # all -- one live run selected 0.387 and aborted PPO. At 60 epochs 45 of 60
    # are above it, the selected checkpoint reaches 0.758, and held-out
    # coordinate error improves from 64 px to 50 px. 120 epochs is no better
    # than 60 (0.758, 49 px), and the learning rate is not the lever: 1e-4,
    # 3e-4 and 1e-3 all behave the same. Cost is seconds of CPU, not flight.
    empirical_epochs: 60
    empirical_learning_rate: 0.001
control:
  dt_seconds: 0.1
  horizon_steps: 300
  action: velocity_yaw_rate
  # Shared by all arms: conservative tracking/landing limits in body-heading axes.
  max_velocity_m_s: [2.0, 2.0, 1.0]
  max_acceleration_m_s2: [1.5, 1.5, 1.0]
  max_yaw_rate_deg_s: 60.0
  max_yaw_acceleration_deg_s2: 90.0
  # Keep early exploration mobile: c=0 uses 50% of the safe command envelope,
  # while the acceleration slew limiter below still rejects abrupt commands.
  curriculum_min_action_scale: 0.50
  # Do not park the target for hundreds of early episodes. At c=0 the UGV
  # already drives at 35% of its sampled road speed (0.0875--0.21 m/s), then
  # increases continuously to the full configured speed at c=1.
  curriculum_min_pad_motion_scale: 0.35
  # The paper conditions every episode on initial visibility, including c=1
  # reward-design and evaluation flights. Visibility loss may occur only after
  # policy handover and is deliberately non-terminal.
  require_initial_pad_visible: true
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  learning_rate: 0.00005
  minimum_learning_rate: 0.000005
  epochs: 3
  sequence_length: 32
  entropy_coef: 0.003
  value_coef: 0.5
  grad_clip: 5.0
  auxiliary_estimation_coefficient: 0.05
  asymmetric_critic: true
  # exp(-1.2)=0.301 provides useful motion from episode one without returning
  # to the original violent standard deviation of 0.607.
  init_log_std: -1.2
  # The visual encoder is now pretrained and frozen, so permit a small but
  # observable state-dependent mean instead of an almost-zero initial policy.
  actor_output_gain: 0.03
  target_kl: 0.03
  # The frozen encoder is already synthetically pretrained. A short live
  # warm-up remains for recurrent state estimation, but must not consume 32 of
  # the seminar run's 160 episodes per arm before the actor starts updating.
  perception_warmup_episodes_quick: 2
  perception_warmup_episodes_full: 8
  perception_warmup_epochs: 2
  # The position-backed PX4 interface makes low-amplitude policy sampling safe;
  # use it during warm-up so both the image target and UAV state are excited.
  perception_warmup_safe_exploration: true
  # Abort an unattended run only on genuine failures. Geometric FOV retention,
  # reacquisition rate and low-keypoint-visibility descent are the dependent
  # variables of the Baseline-vs-Proposed comparison and are therefore
  # reported, never fatal: terminating the Baseline for scoring badly on them
  # would delete the weakness the proposed FOV-risk reward exists to improve.
  health_window_episodes: 20
  health_grace_episodes: 40
  # Ceiling on the zero-success grace. no_landing_abort_episode() takes
  # min(this, 0.75 * planned episodes), so the code default of 120 was a hard
  # stop tuned for the seminar preview budget: against the declared 40,000
  # training episodes it is 0.3% of the run, and it aborted a resumed run three
  # hours in. 10% of the reference budget keeps the guard meaningful -- a setup
  # that can never land is still caught in days rather than months -- while
  # giving PPO a realistic window to find a first sparse touchdown.
  health_no_landing_max_grace_episodes: 4000
  health_max_position_rmse_m: 3.0
  health_max_active_reward_saturation_fraction: 0.80
  # Perception-infrastructure witness: the pad centre was geometrically inside
  # the frame and the frozen encoder still reported no landmarks at all. No
  # policy can cause this, so it remains fatal.
  health_max_blind_perception_fraction: 0.98
  health_min_geometric_fov_scored_step_fraction: 0.10
  # The seeded low-reserve battery is an intended state variable; above 60%
  # termination indicates it is overwhelming task learning rather than merely
  # exposing the ontology to energy risk.
  health_max_battery_depletion_fraction: 0.60
  health_min_relative_improvement: 0.05
curriculum:
  enabled: true
  levels: 80
  update_every_episodes: 512
  # Short live runs must not be forced from c=0 to c=1 regardless of learning.
  # Hold each level until recent physical landing, FOV and common truth-side
  # relative-position RMSE metrics pass. The criterion is identical for all arms.
  performance_gated: true
  assessment_window: 20
  minimum_episodes_at_level: 20
  success_rate_threshold: 0.20
  max_position_rmse_m: 2.0
  max_geometric_fov_loss_fraction: 0.50
reward:
  terminal: {success: 10.0, failure: -10.0}
  active_perception: {enabled: true, alpha: 0.1, beta: 1.0, tau: 0.01}
seeds:
  model_initialization: 42
  training_start: 20000
  rgat_dataset_start: 70000
  evaluation_start: 5000
  # The keypoint survey's own reset seed, disjoint from every training and
  # evaluation seed so the setup flight cannot reuse a measured episode's
  # initial condition.
  keypoint_calibration: 31337
training:
  # Not reported by Shin et al.; explicit reference-budget choices. The outer
  # run.sh applies the seminar deadline budget (800 total across selected arms)
  # without changing this flight-contract config or invalidating checkpoints.
  episodes_quick: 8
  episodes_full: 40960
rgat_design:
  # Actual held-out flights by the trained Shin policy. Graph inputs use its
  # recurrent visual estimates; labels use the observed physical-contact result.
  episodes_quick: 8
  episodes_full: 400
  sample_stride: 3
  outcome_discount: 0.99
  minimum_successful_recovery_episodes_quick: 1
  minimum_successful_recovery_episodes_full: 2
  monotonic_weight: 0.25
  monotonic_margin: 0.01
  minimum_monotonic_compliance: 0.90
