extends: shin2026_baseline.yaml
experiment: two_pipeline_fov_risk
pipelines: [shin_se_fixed, shin_se_onto_rgat_recovery]
paired_seeds: true

# The two declarations are deliberately identical through the complete Shin
# baseline. The proposed arm adds only the final two FOV flags.
pipeline_contract:
  shin_se_fixed:
    state_estimation: true
    auxiliary_estimation_loss: true
    active_perception: true
    reward_mode: shin_table_active
    ontology_enabled: false
    ontology_input_mode: null
    use_direct_rgat_potential: false
    fov_risk_reward: false
    use_adaptive_reward_weights: false
    adaptive_reward_architecture: null
    fov_reward_readout: null
  shin_se_onto_rgat_recovery:
    state_estimation: true
    auxiliary_estimation_loss: true
    active_perception: true
    reward_mode: shin_table_active
    ontology_enabled: true
    ontology_input_mode: fov_semantic_observation
    use_direct_rgat_potential: false
    fov_risk_reward: true
    use_adaptive_reward_weights: false
    adaptive_reward_architecture: null
    # The scalar is the FutureFOVUnavailability node of the second relational
    # layer (units=1). No separate readout MLP or linear head.
    fov_reward_readout: direct_graph_scalar

fov_risk:
  lambda_fov: 0.1
  prediction_horizon_seconds: 1.0
  # Geometric camera-frustum visibility of the landing-pad centre, from
  # simulator geometry only (isaac_sim/keypoint_geometry.py). Deliberately not
  # marker-detection success and not learned keypoint confidence: at 10 Hz
  # control the label says whether geometric FOV is lost within the next ten
  # control steps.
  visibility_criterion: geometric_pad_center_in_fov
  freeze_during_ppo: true

fov_risk_design:
  source_pipeline: shin_se_fixed
  episodes_quick: 8
  # The collection loop exits on ``len(episodes) >= episodes_full AND
  # target coverage``, so this is a floor on episodes, not on samples. The
  # 2026-09-18 run reached coverage at 233 episodes / 56,459 supervised
  # samples and then kept flying against a 40,000-episode floor it could not
  # reach in under three months. 400 was roughly twice the set that already
  # covered both regimes -- about 96,000 samples for a hidden_dim 24 readout.
  # Lowered to 120 on 2026-09-21: the encoder redesign changed the visual
  # features, so the 283 stored episodes are no longer reusable and the floor
  # has to be flown again by one dedicated pair at ~5 wall minutes an
  # episode (400 -> ~33 h before the proposed arm can start, 120 -> ~10 h).
  # 120 episodes are ~30,000 supervised samples for a 10-feature, hidden_dim
  # 24 readout; coverage of both regimes is still required to stop.
  episodes_full: 120
  max_episodes_quick: 24
  max_episodes_full: 360
  validation_fraction: 0.2
  epochs_quick: 10
  epochs_full: 80
  batch_size: 64
  learning_rate: 0.0005
  hidden_dim: 24
  relation_dim: 6
  heads: 1

# Disable the inherited legacy potential-design block on the primary path.
rgat_design: null

# Both arms start from one cloned checkpoint, so the warm start is a property
# of the comparison rather than of either side of it. Without it PPO's first
# episodes are a randomly initialised network, and on this stack a diverging
# episode does not merely score badly: it ends tens of metres from a deck that
# is still driving, and the next entry becomes a stern chase the budget has to
# pay for. The 2026-09-18 run is the evidence -- every one of its 23 entry
# failures began 21 m or further out.
behavior_cloning:
  enabled: true
  # The encoder the demonstrations are stored against must be estimator-free,
  # so the stored actor inputs are the image embedding and proprioception the
  # deployed actor has and nothing else.
  source_pipeline: no_se_fixed

  # The proven teacher, restored 2026-09-19 to unblock the pipeline.
  #
  # image_based_visual_servo_v1 is the better *kind* of teacher -- it reads
  # only the frozen encoder's centroid and apparent scale, so the mapping
  # being cloned is one the student can reproduce without the simulator -- and
  # it is still implemented, tested and selectable. It has not yet been tuned
  # to land: 16 flights over seven tunings, 0 successes, while this teacher
  # has 4/4, 4/4, 4/4, 3/3 and 4/8 on recorded runs. The demonstrations are
  # training-only either way, and nothing from them reaches the deployed actor
  # beyond the image embedding and proprioception.
  #
  # To switch back: set the teacher below and restore position_gain to 0.55.
  teacher: privileged_relative_state_velocity_pd_v4
  # 4 is what the recorded successful runs used; 6 was this session's choice
  # and it is not worth the extra flights. The attempt budget is sized from
  # the rate actually measured on this profile rather than from those runs':
  # they landed 4/4, this stack is landing about 1 in 3 because a flight that
  # converges can still lose the marker, climb, and spend the rest of its 30 s
  # recovering. At 1/3, 24 attempts clear 4 successes with ~98% probability
  # where 14 would have been a coin toss.
  successful_episodes: 4
  # About 46% of episodes are dealt a reduced pack and this teacher lands none
  # of them, so the budget has to be sized on the full-pack draws alone:
  # measured 3 successes in 18 flights overall, or roughly one in six. 24
  # attempts was a coin toss against 4 successes; 40 clears it.
  max_attempts: 40
  # The teacher stage is warm-start data collection, not the experiment, so it
  # may fly an easier deck than PPO will: the demonstrations only have to be
  # successful landings for the policy to start from.
  #
  # This is what buys the servo its closing authority. pad.speed_range_m_s
  # tops out at 0.60 m/s and the horizontal clamp below is 0.60 m/s, so at
  # curriculum 1.0 the entire speed budget goes on matching the deck and the
  # lateral error simply stops converging -- five consecutive tunings measured
  # 0.32-0.39 m of standing error from completely different vertical
  # schedules. 0.40 scales the deck to 0.366 m/s and leaves 0.234 m/s to close
  # with, without raising a loop gain that has already been shown not to take
  # it. The entry draw is correspondingly gentler, which is also what a
  # demonstration pass wants.
  # Lowered again 2026-09-19 after 21 flights landed 2. The dominant failure
  # is not energy and not the descent: 10 of 11 timeouts ended *outside* the
  # 0.35 m position criterion, between 0.42 m and 1.57 m. The teacher simply
  # cannot close the seeded entry offset against a moving deck inside a 30 s
  # episode often enough.
  #
  #   0.40 -> deck 0.366 m/s, entry offsets +-1.20 m
  #   0.20 -> deck 0.288 m/s, entry offsets +-0.60 m
  #
  # Halving the offset it has to close while slowing what it is closing on
  # attacks that directly, where the budget only absorbs it. The cost is that
  # the demonstrations come from an easier regime than PPO will train in --
  # acceptable for a warm start, and the same trade already made at 0.40.
  curriculum: 0.20

  # Servo gains. The proportional path is multiplied by
  # reference_scale / raw_scale, so these are the gains at the apparent size a
  # target has partway through the approach; the flare inherits smaller ones
  # and the far field larger, bounded either side.
  # CAREFUL: both teachers read position_gain and mean different things by it.
  # 0.35 with velocity_gain 0.75 is the privileged PD's proven pair; the image
  # servo wants 0.55 and ignores velocity_gain.
  position_gain: 0.35
  velocity_gain: 0.75

  # Scale the descent with how little charge is left. Enabled 2026-09-19 after
  # 20 teacher flights split perfectly on the pack the episode was dealt:
  #
  #   full pack (1.000),   8 flights : 3 landed, 0 ran out of energy
  #   reduced pack (<1.0), 9 flights : 0 landed, 9 ran out of energy
  #
  # A nominal descent spends 5500-6800 J; a reduced pack carries 2300-4700 J,
  # so those episodes cannot be flown at the nominal rate by anyone. Three of
  # them ran out while *already inside* the 0.35 m position criterion.
  #
  # urgency = energy_urgency * battery_risk, and battery_risk is 1 - reserve
  # read *live* each step, so this is not only about the pack an episode is
  # dealt: urgency ramps through every flight as the charge goes down. A half
  # pack is urgent from its first step; a full one becomes urgent on the way
  # in. Measured on the same seed and entry, full-pack 90000 landed in 173
  # steps with this on against 258 with it off, at 0.13 m of lateral error
  # either way -- it simply stopped dawdling once the pack was half gone.
  #
  # The compressed rate is still capped under the touchdown criterion: a
  # landing too fast to pass the gate is not a demonstration.
  # DISABLED 2026-09-19, by its own evidence. The premise was that a thin pack
  # is survived by getting down sooner. It is not: this energy model charges
  # far more for the faster vertical manoeuvre than the shorter flight saves.
  # Same seed, same 2882.5 J:
  #
  #   off : 152 steps (15.2 s) -> 190 W, which is the 186 W hover figure
  #   on  :  57 steps ( 5.7 s) -> 506 W
  #
  # It died nearly three times sooner. Gating the compression on alignment did
  # not help either -- a seeded entry already inside the gate starts hurrying
  # immediately. The implementation and its tests are kept because the finding
  # is worth keeping, not because the setting is worth turning on.
  #
  # Reduced-pack episodes therefore remain unwinnable for this teacher, and
  # the attempt budget below absorbs them instead.
  energy_urgency: 0.0
  # Recorded explicitly rather than left to the code default, so config_hash
  # keeps meaning "this configuration produced these demonstrations".
  urgency_alignment_m: 0.25
  # Recovery climb trigger (2026-09-20). The teacher climbs on *sustained
  # blindness* -- fewer than two landmarks reported for climb_risk x 2 s --
  # and no longer on a partially visible pad. With the honest v4 encoder the
  # old ``visible fraction < 0.5`` trigger fired exactly where a correct
  # approach passes: directly above the deck only 2 of 6 landmarks are inside
  # the 60-deg-pitched camera between 0.4 and 1.0 m, so the teacher climbed at
  # ~1.1 m, re-acquired at 1.2 m and never touched down (0 of 40 flights; the
  # collapsed v5 encoder had hidden the rule by calling 77 % of out-of-frame
  # landmarks visible). Set visual_loss_climb_fraction above 0 to restore a
  # partial-visibility trigger.
  visual_loss_climb_risk: 0.25
  visual_loss_climb_fraction: 0.0
  # The cue itself (2026-09-21). "perception" reads the frozen encoder's
  # visibility; "geometric" reads the pipeline's one definition of FOV loss,
  # the pad centre leaving the camera frustum (simulator truth, which this
  # privileged teacher already flies on). With "perception" and the honest
  # v4 encoder the second run still hovered at 0.6-1.0 m over decks it was
  # aligned on to 12 cm (seed 90025 timed out with no contact where it had
  # landed at 23.5 s under v5): directly above the deck only two landmarks
  # are in frame, and one visibility miss makes the observation "blind" for
  # long enough to trip the climb. The teacher's actions are training-only
  # labels either way; nothing here reaches the student.
  visual_loss_climb_source: geometric
  # Vertical schedule and time budget (2026-09-21), from the per-step traces
  # of the third v4 run. From the 5 m entry the v4 ladder (0.35 / 0.14 /
  # 0.04 m/s above 1.1 m, 0.6-1.1 m, below 0.6 m) needs about 30 s of
  # uninterrupted alignment inside a 30 s episode, and alignment on the
  # random-walk deck is intermittent: seed 90004 aligned at step 54 and was
  # still 1.9 m up at step 300 with no contact. The touchdown criterion is
  # 0.55 m/s vertical, so a 0.10 m/s flare keeps a five-fold margin; the
  # approach descent lets a vehicle above 2.5 m that is within 1.5 m come
  # down while it closes (the pad stays inside the 32-deg vertical half-angle
  # there), and the horizon gives a slow but converging flight the extra
  # 15 s it needs. Demonstrations are warm-start data, not the experiment:
  # PPO keeps its 300-step episodes. (``pd_`` prefix: the visual-servo
  # teacher below owns the unprefixed descent keys.)
  pd_descent_high_m_s: 0.50
  pd_descent_mid_m_s: 0.25
  pd_descent_flare_m_s: 0.10
  pd_approach_descent_m_s: 0.20
  pd_approach_min_altitude_m: 2.5
  pd_approach_lateral_m: 1.5
  horizon_steps: 450

  # ---- image_based_visual_servo_v1 only; ignored by the PD above ----
  # The integrator is slowed, not weakened. Its authority is gain x limit and
  # still has to clear the deck (below), but a fast integrator on a loop with
  # almost no derivative term is what makes it hunt: the sampled lateral error
  # cycled +-0.25 m at limit 0.60 and +-0.50 m at 1.30. Lowering the gain and
  # raising the limit keeps the final authority and lengthens the time
  # constant, which is where the phase margin comes from.
  integral_gain: 0.20
  # Raised with it. 0.12 against a 0.55 proportional and an integral term was
  # not enough damping to stop the hunt.
  damping_gain: 0.35
  # integral_gain x integral_limit is the entire chase velocity the integrator
  # can command. At 0.45 x 0.60 that was 0.27 m/s against a 0.366 m/s deck, so
  # it could never cancel the motion and the proportional term had to hold a
  # standing error to make up the rest -- the type-0 behaviour the integral is
  # there to remove. 0.20 x 3.00 = 0.60 m/s clears it.
  integral_limit: 3.00
  # Unsaturated RMS keypoint spread, which is what raw_scale reports. Measured
  # on the stack: a deck 5 m out reads about 0.04. The first tuning used 0.25
  # and pinned the range gain against its own ceiling for the whole approach,
  # so the scheduling did nothing until the flare.
  reference_scale: 0.06
  # Held at the value the servo is measurably stable at. Opening it to 1.20 to
  # buy closing authority did buy it and then lost the loop: seed 90000 ran to
  # 3.94 m and climbed away, the same signature a flat 0.50 m/s descent
  # produced. This loop has integral action and very little damping, so it
  # does not tolerate more gain -- the authority has to come from the deck
  # being slower, not from the servo being faster. See curriculum above.
  horizontal_speed_limit_m_s: 0.60

  # The descent gate, as a bearing: offset divided by range, so the distance
  # it admits shrinks with altitude on its own -- about 1.3 m at 5 m and 0.2 m
  # at 1 m -- and nothing has to measure altitude.
  #
  # It has to clear what the horizontal loop actually holds. The first three
  # teacher flights of 2026-09-19 tracked the deck correctly the whole way
  # (0.0% and 1.7% geometric FOV loss, against 96% for the untrained policy
  # the FOV stage had been flying) and still landed nothing: they held 0.76 m
  # at 5 m, a bearing of 0.18, against a cone of 0.10. All three hovered out
  # the full 300-step horizon at 0.01 m/s of vertical speed, and the second
  # one drained the pack doing it.
  alignment_tolerance: 0.30
  rate_tolerance: 0.60
  # A cone fixed in angle keeps shrinking in metres, and near the deck it ends
  # up demanding better alignment than the 0.35 m the touchdown criteria ask
  # for -- so the descent stalls short of a landing that would have counted.
  # Widening it with apparent scale (which goes as 1 / range) holds the metres
  # it implies roughly constant: ~1.3 m at 5 m, 0.39 m at 1 m, 0.2 m at flare.
  cone_widening: 1.2

  # Descent schedule, m/s. These are ceilings reached only when the vehicle is
  # centred: the commanded rate is proportional to how much of the cone is
  # left. A flat rate is what broke the second tuning -- descending magnifies
  # the bearing to a pad that is not directly below, so coming down at a flat
  # 0.50 m/s drove the deck out of frame and left seed 90000 8.6 m out and
  # climbing, against 0.32 m and still descending at 0.35 m/s from the same
  # entry. The ceilings are bounded by the touchdown criterion (0.55 m/s)
  # rather than by caution: Table I starts the vehicle 2-8 m up inside a 30 s
  # episode, and 0.35/0.14/0.04 could not reach the deck from the top of that.
  approach_descent_m_s: 0.50
  descent_rate_m_s: 0.30
  flare_descent_m_s: 0.25
  # Without a floor the last half metre is an asymptote: below it the camera
  # (mounted 0.16 m down) is close enough that the bearing grows faster than
  # the cone widens. Flown open loop the descent settled at 0.37 m and stopped.
  descent_floor: 0.12

  # Saturated apparent scale, the same reading _landing_phase defines the
  # approach/descent/touchdown phases on. Past flare_scale the marker is
  # expected to fill and leave the frame, so visibility loss stops commanding
  # a climb rather than trapping the vehicle above the deck.
  # Has to stay below flare_scale or the bands inverse: a vehicle that has
  # just committed would take the *approach* rate, diving the last 1.2 m at
  # 0.50 m/s. 0.12 is about 2 m, so the ladder is 0.50 above 2 m, 0.30 from
  # 2 m to 1.2 m, and the flare rate once committed.
  approach_scale: 0.12
  # The commit point, and it has to come before the marker leaves the frame on
  # its own -- otherwise it can never latch, because apparent scale is measured
  # from the very keypoints that have gone. Flown at 0.40 (about 0.63 m of
  # altitude) it never once engaged: the sampled trajectory lost the deck at
  # 1.09 m and climbed away from 0.51 m to 1.49 m. 0.20 is about 1.2 m, above
  # where the pad has been observed to leave the frame. Past this the flare
  # rate runs regardless of bearing and visibility loss stops commanding a
  # climb.
  flare_scale: 0.20
  noise_std: 0.01

  epochs: 12
  learning_rate: 0.0003
  sequence_length: 48
  auxiliary_coefficient: 0.20
  post_log_std: -2.5

  # Keep the demonstrations from being forgotten before PPO earns its first
  # sparse success. Identical for both arms; critic and reward stay on-policy.
  ppo_anchor:
    enabled: true
    until_policy_episode: 16
    interval_episodes: 1
    epochs: 1
    learning_rate: 0.00005
    minimum_learning_rate: 0.00001
    sequence_length: 48
    auxiliary_coefficient: 0.10

seeds:
  fov_risk_dataset_start: 70000
  behavior_cloning_start: 90000
  estimator_warmup_start: 19000
  independent_training_starts_full: [20000, 120000, 220000]

training:
  episodes_quick: 8
  # Measured throughput on this machine is ~20 episodes per hour per pair,
  # and the two arms train on their own pairs in parallel: 1,000 episodes per
  # arm is ~50 h of flying, ~2 days of wall clock. The 40,000 this replaced
  # was ~83 days, which is why the dashboard's "학습 checkpoint" tile could
  # only ever read a handful against 80,016. The accumulated datastore lets a
  # later run extend this rather than restart it.
  episodes_full: 1000
  # Deck motion the PPO episodes are flown against, one analytic scenario per
  # episode rotated by episode index, replacing the single
  # ``training_random_walk`` deck. All six are closed form in
  # pad_motion._prepare_benchmark_motion, so an episode is decided by its seed
  # and its scenario alone.
  #
  # REQUIRES pad.motion: random_walk in the system profile. pad_motion.pose()
  # dispatches on pad.motion, and only its random_walk branch reads the
  # per-scenario trajectory; under pad.motion: waypoints the scenario name is
  # recorded but the deck follows the waypoint route regardless. The campus
  # profile (config/shin2026-system.yaml) uses waypoints, so these names have
  # no effect there -- see the minimal profile.
  #
  # The rotation is by index, not drawn, so a resumed run continues the same
  # cycle and both paired arms fly the identical deck on the identical seed --
  # which is what paired_seeds rests on.
  #
  # NOTE: evaluation below now uses this same six-scenario set, so no deck
  # motion is held out. Cross-motion generalization cannot be claimed from this
  # configuration; the comparison between the two arms remains paired and fair.
  scenarios:
    - straight_8mps
    - circle
    - linear_acceleration_wave
    - zigzag
    - u_turn
    - vertical_heave_boat
  independent_seeds_full: [42, 1042, 2042]

evaluation:
  # Equal weight per scenario, matching training.scenarios exactly.
  # ``training_random_walk`` is retired from both: 10,000 of the previous
  # 16,000 evaluation flights per arm were that one deck.
  #
  # Sized against measured throughput, not against a round number. Every
  # seed here is flown twice -- once per arm, same seed, same deck, policy
  # crossed -- so the count below is per arm and the run flies 2x it. At the
  # ~20 episodes per hour per pair this stage measures, 1,000 per scenario
  # was 6,000 per arm and 12.5 days of evaluation behind 2 days of training.
  #
  # 200 per scenario is 1,200 paired seeds per arm. A success rate near 0.5
  # then carries a 95% interval of about +/-2.8%p per arm, and the paired
  # difference -- the quantity the experiment exists to report -- is tighter
  # still, because both arms fly the identical seed and deck and the seed's
  # own difficulty cancels.
  straight_8mps: 200
  linear_acceleration_wave: 200
  circle: 200
  zigzag: 200
  u_turn: 200
  vertical_heave_boat: 200

