# Meta-Sejong S1 campus overlay for the PX4 UAV landing experiment.
# The original UGV competition interfaces and scoring server are not replaced.
extends: system.yaml

system:
  # The licensed campus scene renders at roughly 2--3 Hz on this GPU. Permit
  # one delayed scene/odom frame without declaring the otherwise healthy PX4
  # estimator invalid during policy control.
  state_timeout_s: 1.5

metasejong:
  enabled: true
  scenario: demo             # demo | dongcheon | jiphyeon | gwanggaeto
  asset_root: external/metasejong/resources/models
  scale: 0.01                # competition USD is authored in centimetres
  prim_path: /World/metasejong
  # Hide the decorative tree group in the transient stage so the UAV, UGV and
  # road remain visible. The licensed source USD is not modified.
  hide_vegetation: true

urban:
  # Do not draw the generated OSM boxes over the photoreal campus. The current
  # campus USD has no machine-readable footprint export, so GNSS runs as open
  # sky until matching occluder geometry is derived.
  enabled: false
  source: synthetic
  origin:
    latitude: 37.5503
    longitude: 127.0736
    altitude: 30.0

pad:
  # The competition start is on only 2.26 m of usable pavement. The carrier is
  # the 720 x 500 x 345 mm AGILEX RANGER MINI 3.0, with the official BSD URDF
  # visual mounted under a separate 1.60 x 1.00 m research landing platform.
  # It follows the surveyed pavement centreline to the north end and reverses
  # over the same path; no unsafe U-turn is attempted on the narrow branch.
  carrier: ugv
  vehicle_model: agilex_ranger_mini_v3
  vehicle_visual_usd: assets/ranger_mini_v3/ranger_mini_v3.usd
  vehicle_dimensions_m: [0.720, 0.500, 0.345]
  vehicle_mass_kg: 75.0
  vehicle_payload_kg: 120.0
  vehicle_max_speed_m_s: 1.0
  # Imported URDF base_link is 0.31 m above the tyre contact plane.
  vehicle_visual_origin_from_road_m: [0.0, 0.0, 0.31]
  motion: waypoints
  deck_size_m: [1.60, 1.00]
  deck_height_m: 0.42
  start_position_enu_m: [-65.00, 131.00, 16.146]
  speed_range_m_s: [0.25, 0.60]
  route_start: continue
  # Move during an idle/manual preview. Episode resets still park the UGV until
  # the policy handover, so takeoff and estimator initialisation remain safe.
  preview_motion: true
  # Keep the vehicle slow enough for PX4's position controller to stay above
  # the deck while still making its motion obvious in the paired camera view.
  preview_speed_scale: 1.0
  waypoint_ramp_s: 4.0
  route_waypoints_enu_m:
    - [-65.00, 131.00, 16.146]
    - [-65.00, 127.00, 16.107]
    - [-67.55, 124.05, 16.048]
    - [-70.23, 121.17, 15.989]
    - [-72.92, 118.28, 15.923]
    - [-75.61, 115.39, 15.836]
    - [-78.29, 112.51, 15.730]
    - [-80.98, 109.62, 15.616]
    - [-83.67, 106.73, 15.501]
    - [-86.50, 103.90, 15.382]
    - [-89.32, 101.08, 15.217]
    - [-92.46, 99.00, 14.990]
    - [-96.46, 99.00, 14.883]
    - [-99.63, 101.03, 14.864]
    - [-102.45, 103.85, 14.860]
    - [-105.28, 106.68, 14.847]
    - [-108.11, 109.51, 14.819]
    - [-110.94, 112.34, 14.777]
    - [-113.77, 115.17, 14.718]
    - [-116.60, 118.00, 14.636]
    - [-119.14, 120.94, 14.560]
    - [-121.97, 123.77, 14.480]
    - [-124.80, 126.60, 14.392]
    - [-127.63, 129.43, 14.311]
    - [-130.46, 132.26, 14.250]
    - [-133.00, 135.20, 14.201]
    - [-135.26, 138.26, 14.146]
    - [-137.40, 141.38, 14.085]
    - [-139.51, 144.51, 14.032]
    - [-141.34, 147.74, 13.988]
    - [-142.33, 151.33, 13.940]
    - [-142.80, 155.14, 13.898]
    - [-143.60, 158.81, 13.888]
    - [-145.02, 162.22, 13.862]
    - [-147.00, 165.40, 13.907]
    - [-148.00, 168.99, 13.918]
    - [-148.60, 172.74, 13.875]
    - [-149.26, 176.46, 13.846]
    - [-150.00, 180.16, 13.831]
    - [-150.60, 183.91, 13.811]
    - [-151.00, 187.75, 13.783]
    - [-151.00, 191.75, 13.739]
    - [-151.00, 195.75, 13.690]
    - [-151.00, 198.00, 13.669]
  heading_follows_velocity: true
  yaw_rate_limit_deg_s: 55.0
  # The default open-field clamp is centred at [0, 0]. Zero disables it so
  # the official campus coordinates are not projected onto an 8 m circle.
  arena_radius_m: 0.0
  lane_change_probability: 0.0

landing:
  ground_z_m: 16.146
  success_xy_m: 0.22

vision:
  # Scaled to the UGV deck. At the lower 2.5 m entry hover the outer tags
  # retain approximately the same image size as the lorry's larger board.
  board:
    - {id: 10, side_m: 0.12, center_xy_m: [0.00, 0.00]}
    - {id: 11, side_m: 0.30, center_xy_m: [-0.48, 0.28]}
    - {id: 12, side_m: 0.30, center_xy_m: [0.48, 0.28]}
    - {id: 13, side_m: 0.30, center_xy_m: [0.48, -0.28]}
    - {id: 14, side_m: 0.30, center_xy_m: [-0.48, -0.28]}

wind:
  # Establish a stable campus/UGV integration baseline. Wind and gust sweeps
  # remain available in system.yaml after the camera/route stack is validated.
  enabled: false
  canyon:
    enabled: false

battery:
  # The research episodes deliberately start almost empty so energy becomes a
  # useful policy input. A continuously running visual demo must not exhaust
  # that artificial 9--55 second episode reserve.
  enabled: false

isaac:
  hover_start_offset_pad_m: [0.0, 0.0, 2.5]
  viewport_follow:
    enabled: true
    # Road-relative view adapted from the competition map's authored S1
    # camera: behind, slightly left, and above. The former world-west offset
    # looked through the dense trees beside the official start position.
    frame: street
    offset_m: [-9.0, 3.5, 9.0]
    focus: pair
    pair_span_m: 7.0
    smoothing: 0.25
