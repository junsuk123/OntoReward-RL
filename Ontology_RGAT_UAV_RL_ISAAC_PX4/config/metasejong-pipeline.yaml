# Meta-Sejong overlay for the complete ontology -> R-GAT -> PPO experiment.
extends: metasejong-demo.yaml

isaac:
  # Keep the 250 Hz physics/HIL loop unchanged, but do not ask this laptop to
  # render both the photoreal campus viewport and a 1280x720 camera at 60 Hz.
  # The physical ZED profile remains 60 Hz in system.yaml; GUI experiments
  # consume a deterministic 20 Hz subset. Headless runs retain all 60 Hz.
  gui_rendering_dt: 0.05
  gui_viewport_resolution: [960, 540]
  # Camera frames are not part of PX4 preflight. Render only a 2 Hz preview
  # until PX4 is ready and the gateway publishes its first flight state, then
  # switch automatically to the normal GUI rate. The time cap keeps a manually
  # launched simulator from staying in preview mode indefinitely.
  startup_rendering_dt: 0.5
  startup_max_sim_s: 30.0

pad:
  # PX4 boots and calibrates on the roof, so the UGV must remain parked until
  # the learner has completed the entry climb. Policy handover releases it for
  # every episode; only the non-training demo uses idle-scene preview motion.
  preview_motion: false
  preview_speed_scale: 1.0

battery:
  # Unlike the indefinite viewing demo, research episodes restore the seeded
  # 9--55 second reserve so BatteryReserve is a meaningful ontology feature.
  enabled: true

wind:
  # The research pipeline must include the dynamic environment.  The visual
  # demo keeps wind off for integration work, but ontology/R-GAT/PPO runs do
  # not inherit that control-condition override.
  enabled: true
  sensor:
    enabled: true
  # The licensed campus mesh has no machine-readable facade footprint yet, so
  # do not invent canyon occlusion. Turbulence and seeded gusts remain active.
  canyon:
    enabled: false

# Learner-owned experiment contract. R-GAT may change during stage 3, but its
# stage-4 reward coefficients are constrained to this range, sum to one and are
# frozen before PPO. The final system passes only when both acceptance gates do.
learning:
  reward_design:
    weight_min: 0.025
    weight_max: 0.45
    importance_floor: 1.0e-6
    max_attribution_samples: 4096
  acceptance:
    min_success_rate: 0.60
    max_success_std: 0.15
    min_worst_case_success: 0.35
    max_rgat_val_mse: 0.35
