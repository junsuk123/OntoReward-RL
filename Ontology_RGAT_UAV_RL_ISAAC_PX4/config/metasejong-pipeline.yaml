# Meta-Sejong overlay for the complete ontology -> R-GAT -> PPO experiment.
extends: metasejong-demo.yaml

pad:
  # PX4 boots and calibrates on the roof, so the UGV must remain parked until
  # the learner has completed the entry climb. Policy handover releases it for
  # every episode; only the non-training demo uses idle-scene preview motion.
  preview_motion: false
  preview_speed_scale: 1.0

battery:
  # Unlike the indefinite viewing demo, research episodes restore the seeded
  # 9--55 second reserve so BatteryReserve is a meaningful ontology feature.
  enabled: true

wind:
  # The research pipeline must include the dynamic environment.  The visual
  # demo keeps wind off for integration work, but ontology/R-GAT/PPO runs do
  # not inherit that control-condition override.
  enabled: true
  sensor:
    enabled: true
  # The licensed campus mesh has no machine-readable facade footprint yet, so
  # do not invent canyon occlusion. Turbulence and seeded gusts remain active.
  canyon:
    enabled: false
