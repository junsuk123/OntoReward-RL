extends: system.yaml

system:
  control_hz: 10.0
  sitl_action_timeout_s: 1.0
  # S5's photoreal mesh occasionally delays one rendered sensor callback past
  # the Flat-Plane 0.5 s budget.  This admits one delayed scene sample without
  # masking a genuinely stopped estimator.
  state_timeout_s: 1.5

isaac:
  # This benchmark is a landing task. Keep the disarmed Iris at a physical
  # hover while PX4 aligns instead of balancing it on a platform only 1.5 m
  # wide; the seeded Table-I entry pose is still flown before data collection.
  start_airborne: true
  # A 60-deg forward/down camera sees a directly-below pad at the edge of its
  # short FOV. Keep the airborne start, but move it behind the deck so the pad
  # centre lies on the optical axis (about -2.51 m X at 4.5 m body altitude).
  center_hover_on_landing_camera: true
  # The campus scene is substantially heavier than Flat Plane. Keep physics
  # and the PX4 HIL loop at full rate while rendering a deterministic GUI
  # subset, as in the validated Meta-Sejong pipeline profile.
  gui_rendering_dt: 0.05
  gui_viewport_resolution: [960, 540]
  startup_rendering_dt: 0.5
  startup_max_sim_s: 30.0
  viewport_follow:
    frame: street
    offset_m: [-10.0, 4.5, 9.0]
    focus: pair
    pair_span_m: 7.0
    smoothing: 0.22

# Use the broad plaza/loop beside Gwanggaeto Hall instead of an empty Flat
# Plane. The benchmark still samples exactly the same pad-relative Table-I
# initial condition; changing its world-space anchor does not alter the task.
# The two parallel pairs are separated along the shared route, not by marker
# identity: the primary landing target is a six-keypoint fiducial, identical on
# every deck, and each pair's camera only ever sees its own. Clear the legacy
# ArUco per-pair keys that config/system.yaml is deep-merged from.
parallel:
  marker_dictionary: null
  marker_id_stride: null

metasejong:
  enabled: true
  scenario: gwanggaeto
  asset_root: external/metasejong/resources/models
  scale: 0.01
  prim_path: /World/metasejong
  hide_vegetation: true

# Shin et al.'s benchmark randomizes a moving platform in an open arena. The
# retained urban experiment remains available through system.yaml, but its OSM
# buildings must not occupy this profile's random-walk origin or trajectories.
urban:
  enabled: false
  source: synthetic
  origin:
    latitude: 37.5503
    longitude: 127.0736
    altitude: 30.0

landing:
  max_time_s: 30.0
  world_xy_limit_m: 60.0

benchmark:
  profile: shin2026
  # c=0 starts at the already-stationary airborne hover support. It blends
  # toward the Table-I draw; at every level the horizontal draw is conditioned
  # on the paper's requirement that the pad starts inside the camera FOV.
  initial_condition_curriculum_min_scale: 0.0
  # Setup-only handover gate, not the touchdown-success threshold. The real
  # PX4/Pegasus hover limit cycle observed in this rendered scene is about
  # 0.34 m/s; 0.40 rejects a fly-through but does not wait forever for 0.15.
  entry_speed_tolerance_m_s: 0.40
  entry_settle_s: 1.0
  # Initial visibility is a single geometric condition: the landing-pad centre
  # must project inside the rendered camera's frustum. No detector takes part.
  entry_view_margin: 0.85
  initial_conditions:
    relative_altitude_m: [2.0, 8.0]
    relative_lateral_x_m: [-3.0, 3.0]
    relative_lateral_y_m: [-3.0, 3.0]
    platform_yaw_misalignment_deg: [-60.0, 60.0]

# Shin et al. Table II, sampled deterministically from each paired episode
# seed. The geometric-controller gain spread is applied as a relative spread
# around equivalent PX4 gains; force, torque, handover state and camera
# appearance are applied directly in Isaac.
domain_randomization:
  enabled: true
  px4_nominal_gains:
    MPC_XY_VEL_P_ACC: 1.8
    MPC_Z_VEL_P_ACC: 4.0
    MC_ROLL_P: 6.5
    MC_PITCH_P: 6.5
    MC_YAW_P: 2.8

# Do not stack the inherited fixed urban wind on top of Table-II force
# randomization. The urban profile retains that wind in config/system.yaml.
wind:
  enabled: false

pad:
  # The paper uses a 1.5 x 1.5 m platform. Mount that platform on the supplied
  # RANGER MINI visual instead of shrinking the inherited box lorry into two
  # overlapping cubes.
  carrier: ugv
  vehicle_model: agilex_ranger_mini_v3
  vehicle_visual_usd: assets/ranger_mini_v3/ranger_mini_v3.usd
  vehicle_dimensions_m: [0.720, 0.500, 0.345]
  vehicle_mass_kg: 75.0
  vehicle_payload_kg: 120.0
  # Keep the campus carrier inside the RANGER MINI's practical low-speed
  # envelope. Paper-speed stress cases belong in a separate sweep, not in the
  # default visual/empirical-data run on this curved road.
  vehicle_max_speed_m_s: 1.0
  vehicle_visual_origin_from_road_m: [0.0, 0.0, 0.31]
  deck_height_m: 0.42
  # The centreline below is sampled from the S5_CarRoad_002 mesh itself.  Its
  # Z coordinates are the rendered asphalt surface, so the carrier neither
  # cuts across the plaza/building nor floats above the road.  It begins on the
  # broad north-east side of the loop, close to the map's authored camera.
  start_position_enu_m: [-41.765, -75.569, 21.360]
  motion: waypoints
  route_start: continue
  waypoint_loop: true
  waypoint_ramp_s: 4.0
  route_waypoints_enu_m:
    - [-41.765, -75.569, 21.360]
    - [-43.005, -74.348, 21.362]
    - [-44.422, -73.171, 21.368]
    - [-46.045, -71.911, 21.376]
    - [-48.000, -70.460, 21.387]
    - [-50.542, -68.582, 21.402]
    - [-53.985, -66.555, 21.405]
    - [-57.400, -66.719, 21.394]
    - [-60.142, -68.529, 21.385]
    - [-62.547, -70.793, 21.386]
    - [-64.853, -73.270, 21.389]
    - [-66.343, -76.324, 21.396]
    - [-66.652, -79.711, 21.397]
    - [-66.380, -83.000, 21.388]
    - [-64.722, -85.949, 21.386]
    - [-62.753, -88.370, 21.379]
    - [-60.921, -90.460, 21.369]
    - [-59.108, -92.320, 21.365]
    - [-57.320, -94.108, 21.365]
    - [-55.480, -95.956, 21.370]
    - [-53.349, -97.697, 21.382]
    - [-50.896, -99.427, 21.393]
    - [-48.000, -100.780, 21.405]
    - [-44.982, -100.116, 21.406]
    - [-42.405, -98.373, 21.395]
    - [-40.150, -96.597, 21.384]
    - [-38.165, -94.720, 21.380]
    - [-36.218, -92.886, 21.374]
    - [-34.646, -90.710, 21.374]
    - [-33.792, -88.171, 21.381]
    - [-34.370, -85.403, 21.381]
    - [-35.780, -83.000, 21.374]
    - [-37.108, -81.079, 21.368]
    - [-38.284, -79.464, 21.363]
    - [-39.409, -78.040, 21.359]
    - [-40.592, -76.784, 21.359]
    - [-41.765, -75.569, 21.360]
  speed_range_m_s: [0.25, 0.60]
  speed_step_perturbation_m_s: [-0.5, 0.5]
  yaw_rate_step_perturbation_deg_s: [-3.0, 3.0]
  motion_update_dt_s: 0.1
  # Waypoints are absolute campus coordinates; the origin-centred open-field
  # clamp must be disabled or it would pull legal road poses toward [0, 0].
  arena_radius_m: 0.0
  yaw_rate_limit_deg_s: 90.0
  deck_size_m: [1.5, 1.5]

gnss:
  # No platform GNSS or V2V estimate is consumed by the benchmark actor.
  enabled: false

vision:
  # The primary benchmark's perception path is a learned six-keypoint encoder,
  # so the deck carries six fixed landmarks rather than bit-coded tags. No
  # ArUco dictionary, marker id or cv2.aruco detector exists on this path; the
  # legacy detector profile survives only in config/system.yaml.
  mode: keypoint_fiducial
  # Explicitly clear the inherited legacy detector settings. config/system.yaml
  # is deep-merged, so leaving these out would silently re-introduce an ArUco
  # dictionary and marker board into the primary experiment.
  dictionary: null
  board: null
  pose_source_for_policy: false
  landing_pad:
    # Six vertices of a pad-centred regular hexagon, first vertex at 30 deg.
    # isaac_sim/keypoint_geometry.py is the single definition; the painted
    # texture, the supervised labels and the geometric FOV truth all read it.
    layout: hexagonal
    landmark_radius_m: 0.52
    landmark_diameter_m: 0.22
    texture_pixels: 2048
  camera:
    model: shin2026_grayscale
    resolution: [512, 320]
    horizontal_fov_deg: 90.0
    pitch_down_deg: 60.0
    rate_hz: 30.0
    mount_translation_flu_m: [0.0, 0.0, -0.16]
    # Condition the Table-I lateral/yaw draw on a conservative inscribed part
    # of the pitched-camera footprint; the geometric pad-centre frustum test
    # remains the final handover gate.
    entry_visible_footprint_fraction: 0.65
    clipping_range_m: [0.02, 60.0]

battery:
  # Use the real 3S 3500 mAh pack, vehicle and rotor specification inherited
  # from system.yaml. Each seeded episode starts with 9--55 hover seconds of
  # that physical pack remaining so energy changes within the 30 s benchmark.
  # The gateway integrates the PX4 thrust setpoint in joules; battery risk is
  # reward-side and is an input to the controlled R-GAT.
  enabled: true

px4:
  sitl_parameters:
    # Match PX4's position/velocity controller to the calibrated Pegasus Iris
    # and the common RL command envelope. These limits also prevent the entry
    # position step from exciting a fast oscillation before policy handover.
    MPC_THR_HOVER: 0.58
    MPC_USE_HTE: 0
    MPC_XY_VEL_MAX: 2.0
    MPC_Z_VEL_MAX_UP: 1.0
    MPC_Z_VEL_MAX_DN: 1.0
    MPC_ACC_HOR_MAX: 1.5
    MPC_ACC_UP_MAX: 1.0
    MPC_ACC_DOWN_MAX: 1.0
    # The stock PX4 SITL pack drains from full to empty in 60 simulated
    # seconds. Airborne episode staging intentionally remains armed, so clamp
    # the simulator-only pack at full charge. The independently integrated
    # experiment pack above still discharges, is logged, and drives R-GAT;
    # hardware never consumes this SITL-only override.
    SIM_BAT_MIN_PCT: 100.0
