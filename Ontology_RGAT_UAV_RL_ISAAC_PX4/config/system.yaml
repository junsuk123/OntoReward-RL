system:
  protocol_version: 1
  control_hz: 50.0
  state_timeout_s: 0.5
  action_timeout_s: 0.25
  target: sitl

network:
  bind_host: 127.0.0.1
  matlab_host: 127.0.0.1
  gateway_port: 14650
  matlab_port: 14651

px4:
  namespace: /fmu
  target_system: 1
  target_component: 1
  source_system: 42
  source_component: 191
  # Measured with tools/calibrate_hover_thrust.py against Pegasus' Iris in
  # Isaac. A wrong value spends the policy's collective authority just holding
  # altitude, which reads as a vehicle that will not stop descending.
  hover_thrust: 0.580
  # Must equal cfg.rl.collectiveSpan in the original workspace: the policy
  # normalises its collective against hover*(1 + span*a), so a smaller span
  # here silently under-actuates every transferred policy in the vertical axis.
  collective_span: 0.85
  max_roll_pitch_deg: 28.0
  max_yaw_rate_deg_s: 90.0
  offboard_prestream_count: 20
  estimator_warmup_s: 3.0

isaac:
  vehicle_id: 0
  namespace: landing_uav
  physics_dt: 0.004
  rendering_dt: 0.02
  environment: Curved Gridroom
  robot_asset: Iris
  spawn_position_enu_m: [0.0, 0.0, 0.07]
  px4_autolaunch: true
  px4_dir: external/PX4-Autopilot
  px4_vehicle_model: gazebo-classic_iris
  mavlink_connection_type: tcpin
  mavlink_connection_ip: localhost
  mavlink_connection_baseport: 4560
  lockstep: true

landing:
  ground_z_m: 0.08
  max_time_s: 14.0
  world_xy_limit_m: 12.0
  max_altitude_m: 12.0
  crash_tilt_deg: 75.0
  success_xy_m: 0.28
  success_vz_m_s: 0.55
  success_tilt_deg: 10.0
  success_rate_deg_s: 45.0

wind:
  enabled: true
  air_density_kg_m3: 1.225
  drag_area_m2: [0.055, 0.055, 0.085]
  drag_coefficient: [1.0, 1.0, 1.2]
  mean_enu_m_s: [1.3, 0.4, 0.0]
  turbulence_m_s: 0.55
  seed: 49
  gusts:
    - {t0_s: 4.0, sigma_s: 0.8, vector_enu_m_s: [2.1, -0.9, 0.5]}
    - {t0_s: 7.2, sigma_s: 0.55, vector_enu_m_s: [-1.4, 1.8, -0.7]}
    - {t0_s: 10.0, sigma_s: 0.45, vector_enu_m_s: [0.8, -1.1, 1.0]}

vision:
  # aruco: a real downward camera detects the pad markers.
  # pose_proxy: the analytic stand-in, for runs that cannot afford rendering.
  mode: aruco
  dictionary: DICT_4X4_50
  # The policy flies on the detected pad-relative pose while the markers are
  # visible, and falls back to the PX4 estimate when they are not.
  pose_source_for_policy: true
  camera:
    resolution: [800, 600]
    horizontal_fov_deg: 90.0
    rate_hz: 30.0
    # Clear of the airframe: at -0.05 the Iris' own legs fill the frame.
    mount_translation_flu_m: [0.0, 0.0, -0.16]
    clipping_range_m: [0.02, 60.0]
  # One small tag at the centre survives to touchdown; the large ring is what
  # is resolvable from the entry altitude. See isaac_sim/marker_vision.py.
  board:
    - {id: 10, side_m: 0.10, center_xy_m: [0.00, 0.00]}
    - {id: 11, side_m: 0.45, center_xy_m: [-0.45, 0.45]}
    - {id: 12, side_m: 0.45, center_xy_m: [0.45, 0.45]}
    - {id: 13, side_m: 0.45, center_xy_m: [0.45, -0.45]}
    - {id: 14, side_m: 0.45, center_xy_m: [-0.45, -0.45]}
  quality_reprojection_px: 3.0
  quality_full_scale_px: 120.0
  # Only used by pose_proxy.
  max_range_m: 7.0
  tilt_scale_deg: 32.0
  xy_scale_m: 2.0
