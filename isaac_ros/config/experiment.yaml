seed: 42
deterministic: true
terrain_classes: [road, grass, urban_building, water]
conditions: [normal, bright, dark, blur, yaw]
repetitions: 1
output_directory: results
image:
  size: 384
  grid_size: 4
  orb_features: 900
  canny_low: 60
  canny_high: 150
optical_flow:
  max_corners: 300
  quality_level: 0.01
  min_distance: 7.0
  ransac_threshold_px: 2.0
matching:
  ratio_test: 0.78
  min_matches: 10
  ransac_threshold_px: 4.0
  low_matchability_reject: 0.18
  correct_tolerance_m: 5.0
rules_file: config/ontology_rules.yaml
