# Additive score: base_score plus every fired contribution, clamped to [0, 1].
base_score: 0.42
classes: {low_max: 0.35, high_min: 0.70}
rules:
  - {id: rich_texture, group: visual, metric: texture_entropy, operator: ">=", threshold: 0.48, contribution: 0.10, explanation: "Rich intensity structure supports distinctive features."}
  - {id: many_features, group: visual, metric: feature_count, operator: ">=", threshold: 0.25, contribution: 0.09, explanation: "Sufficient ORB support is available."}
  - {id: distributed_features, group: distribution, metric: feature_distribution_uniformity, operator: ">=", threshold: 0.55, contribution: 0.12, explanation: "Features cover the image and improve geometric observability."}
  - {id: low_aliasing, group: repetitiveness, metric: repetitiveness_score, operator: "<=", threshold: 0.35, contribution: 0.10, explanation: "Low descriptor self-similarity reduces false-place risk."}
  - {id: repetitive_aliasing, group: repetitiveness, metric: repetitiveness_score, operator: ">=", threshold: 0.55, contribution: -0.18, explanation: "Repeated descriptors increase perceptual aliasing risk."}
  - {id: sharp_image, group: quality, metric: blur_quality, operator: ">=", threshold: 0.25, contribution: 0.08, explanation: "Laplacian energy indicates usable image sharpness."}
  - {id: exposure_quality, group: quality, metric: brightness_quality, operator: ">=", threshold: 0.55, contribution: 0.05, explanation: "Exposure is away from saturation and darkness."}
  - {id: stable_tracks, group: flow, metric: flow_valid_ratio, operator: ">=", threshold: 0.65, contribution: 0.06, explanation: "Most short-term features remain trackable."}
  - {id: coherent_geometry, group: flow, metric: flow_inlier_ratio, operator: ">=", threshold: 0.70, contribution: 0.12, explanation: "RANSAC-consistent flow supports temporal stability."}
  - {id: inconsistent_flow, group: flow, metric: flow_inlier_ratio, operator: "<=", threshold: 0.30, contribution: -0.16, explanation: "Inconsistent flow suggests dynamic or unstable texture."}
