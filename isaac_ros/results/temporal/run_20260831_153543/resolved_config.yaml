random_seed: 73
output_directory: results/temporal
epochs:
- name: Year0
  year: 0
  season: summer
  weather: clear
  component_overrides: {}
- name: Year2
  year: 2
  season: spring
  weather: clear
  component_overrides: {}
- name: Year5
  year: 5
  season: autumn
  weather: cloudy
  component_overrides: {}
- name: Year10
  year: 10
  season: winter
  weather: snow
  component_overrides: {}
- name: CaseAppearance
  year: 6
  season: autumn
  weather: cloudy
  component_overrides:
    vegetation: 1.0
    building: 0.0
    road_appearance: 0.7
    road_geometry: 0.0
    season: 1.0
    weather: 0.5
    illumination: 1.0
- name: CaseStructural
  year: 6
  season: summer
  weather: clear
  component_overrides:
    vegetation: 0.3
    building: 1.0
    road_appearance: 0.8
    road_geometry: 1.0
    season: 0.0
    weather: 0.0
    illumination: 0.8
time:
  mode: epoch
  days_per_real_second: 365.0
  maximum_year: 10.0
camera:
  resolution:
  - 512
  - 512
  altitude_m: 45.0
  focal_length_mm: 24.0
  trajectory_mode: spiral
  trajectory_xy: []
  spiral_center_xy_m:
  - 0.0
  - 0.0
  spiral_start_radius_m: 12.0
  spiral_end_radius_m: 92.0
  spiral_turns: 2.5
  spiral_samples: 32
  clockwise: false
  capture_fps: 8.0
map:
  extent_m: 300.0
  canvas_px: 1800
changes:
  tree_initial_count: 24
  tree_new_count: 8
  tree_scale_range:
  - 0.65
  - 1.55
  building_complete_year: 5
  building_renovate_year: 10
  road_resurface_year: 5
  road_expand_year: 10
capture:
  save_images: true
  save_epoch_usd_layers: true
  image_backend: opencv
score_weights:
  vegetation: 0.18
  building: 0.18
  road_appearance: 0.12
  road_geometry: 0.14
  season: 0.14
  weather: 0.1
  illumination: 0.14
events:
- event_id: tree_growth_01
  virtual_year: 1
  target_prim: /World/Environment/Vegetation
  event_type: TREE_GROW
  parameters:
    scale: 1.1
  change_ground_truth: 0.1
- event_id: construction_start_01
  virtual_year: 2
  target_prim: /World/Environment/Buildings/Development
  event_type: BUILDING_CONSTRUCTION_START
  parameters:
    variant: Construction
  change_ground_truth: 0.42
- event_id: new_trees_01
  virtual_year: 3
  target_prim: /World/Environment/Vegetation
  event_type: TREE_APPEAR
  parameters:
    count: 4
  change_ground_truth: 0.15
- event_id: construction_complete_01
  virtual_year: 5
  target_prim: /World/Environment/Buildings/Development
  event_type: BUILDING_CONSTRUCTION_COMPLETE
  parameters:
    variant: Completed
  change_ground_truth: 0.78
- event_id: road_resurface_01
  virtual_year: 5
  target_prim: /World/Environment/Roads/Main
  event_type: ROAD_RESURFACE
  parameters:
    material: fresh_asphalt
  change_ground_truth: 0.65
- event_id: road_expand_01
  virtual_year: 10
  target_prim: /World/Environment/Roads/Main
  event_type: ROAD_EXPAND
  parameters:
    width_scale: 1.35
  change_ground_truth: 0.9
- event_id: building_renovate_01
  virtual_year: 10
  target_prim: /World/Environment/Buildings/Development
  event_type: BUILDING_RENOVATE
  parameters:
    variant: Renovated
  change_ground_truth: 1.0
